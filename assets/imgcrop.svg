<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Image Cropper</title>
  <desc id="description">A landscape photo framed by four crop handles.</desc>
  <defs>
    <linearGradient id="appBackground" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7667F3"/>
      <stop offset="1" stop-color="#3B2E9A"/>
    </linearGradient>
    <linearGradient id="sky" x1="64" y1="29" x2="64" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9E4FF"/>
      <stop offset="1" stop-color="#E8F8FF"/>
    </linearGradient>
    <linearGradient id="mountain" x1="39" y1="75" x2="92" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E8F9A"/>
      <stop offset="1" stop-color="#0D536D"/>
    </linearGradient>
    <filter id="shadow" x="14" y="18" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#201858" flood-opacity=".32"/>
    </filter>
    <clipPath id="photoClip">
      <rect x="27" y="29" width="74" height="70" rx="12"/>
    </clipPath>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#appBackground)"/>
  <rect x="17" y="17" width="94" height="94" rx="24" fill="#FFF" opacity=".09"/>

  <g filter="url(#shadow)">
    <rect x="27" y="29" width="74" height="70" rx="12" fill="url(#sky)"/>
    <g clip-path="url(#photoClip)">
      <circle cx="80" cy="48" r="9" fill="#FFD65A"/>
      <path d="M22 98 49 65l17 19 13-14 29 28Z" fill="url(#mountain)"/>
      <path d="M36 99 58 76l14 16 8-8 16 15Z" fill="#46B3AA"/>
      <path d="M22 92c17-5 31-2 43 4 13 7 24 5 41-2v12H22Z" fill="#0B526B" opacity=".82"/>
    </g>
  </g>

  <path d="M23 47V26a3 3 0 0 1 3-3h21 M81 23h21a3 3 0 0 1 3 3v21 M105 81v21a3 3 0 0 1-3 3H81 M47 105H26a3 3 0 0 1-3-3V81"
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="23" cy="47" r="4" fill="#FFFFFF"/>
  <circle cx="105" cy="47" r="4" fill="#FFFFFF"/>
  <circle cx="105" cy="81" r="4" fill="#FFFFFF"/>
  <circle cx="23" cy="81" r="4" fill="#FFFFFF"/>
</svg>
